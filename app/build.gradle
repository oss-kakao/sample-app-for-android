plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kakao.olivesample'
    compileSdk 34

    defaultConfig {
        applicationId "com.kakao.olivesample"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // The app never posts notifications; this only fires because Picasso's unused
        // RemoteViewsAction.NotificationAction sits on the classpath.
        disable 'NotificationPermission'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // NOTE: app/libs/*.jar are 30-byte name placeholders, not real archives, so D8 fails on them
    // with "zip END header not found". Re-enable once the real jars are checked in.
    // implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'io.github.cozodb:cozo_android:0.5.1'
    // NOTE: 'com.rogers.test:unmapping:1.0.0' is not published to google()/mavenCentral()/jitpack.
    // It only ever resolved from the now shut-down jcenter, so it is disabled to keep the build green.
    // implementation 'com.rogers.test:unmapping:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
